[project]
name = "agentops-cockpit"
version = "0.1.0"
description = "Drop-in OpenTelemetry observability + auto-triage copilot for AI agents, powered by SigNoz."
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
